<div class="container mt-5 text-center">
  <h1>Welcome to FlowForge Cloud</h1>
  <p class="lead text-muted">Workflow automation platform</p>

      <i class="fa-solid fa-right-to-bracket me-1"></i>
      {{ 'AbpAccount::Login' | abpLocalization }}
    </button>
  }
</div>
