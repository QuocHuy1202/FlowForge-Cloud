name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlowForge.slnx

      - name: Build Release
        run: dotnet build FlowForge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlowForge.slnx --configuration Release --no-build --no-restore --logger trx --results-directory ../artifacts/backend-tests

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: artifacts/backend-tests/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/angular
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile --non-interactive

      - name: Unit tests
        run: yarn test --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Production build
        run: yarn build:prod

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: frontend/angular/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-production-build
          path: frontend/angular/dist/FlowForge/
          if-no-files-found: error
          retention-days: 7
